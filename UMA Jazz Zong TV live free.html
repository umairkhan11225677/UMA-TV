<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UMA TV - Live Jazz & Zong TV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7"></script>
  <style>
    :root {
      --cyber-bg: #030712;
      --cyber-card: rgba(15, 23, 42, 0.85);
      --cyber-primary: #00f3ff;
      --cyber-secondary: #ff0055;
      --cyber-glow: rgba(0, 243, 255, 0.25);
      --cyber-border: rgba(0, 243, 255, 0.25);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100vh;
      background: #030712;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 243, 255, 0.08) 0%, transparent 60%),
        linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #e2e8f0;
      overflow: hidden;
    }

    #main-app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* LOCKED TOP PLAYER AREA */
    .sticky-top {
      flex-shrink: 0;
      z-index: 100;
      background: rgba(3, 7, 18, 0.98);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--cyber-border);
    }

    header {
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.8) 0%, transparent 100%);
      gap: 6px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .header-logo {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #090d16;
      border: 1.5px solid var(--cyber-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 900;
      color: #fff;
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.4);
      line-height: 1;
      flex-shrink: 0;
    }

    .header-logo span {
      font-size: 0.5rem;
      color: var(--cyber-secondary);
      margin-top: 1px;
    }

    .header-title-wrap {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    header h1 {
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    header h1 span {
      color: var(--cyber-secondary);
      text-shadow: 0 0 8px rgba(255, 0, 85, 0.6);
    }

    .header-sub {
      font-size: 0.62rem;
      color: var(--cyber-primary);
      font-family: monospace;
      letter-spacing: 0.5px;
    }

    .digital-clock {
      font-family: monospace;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--cyber-primary);
      background: rgba(0, 243, 255, 0.08);
      border: 1px solid var(--cyber-border);
      padding: 4px 6px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.15);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* PLAYER AREA */
    .player-area {
      padding: 8px 16px;
    }

    .player-title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
      min-height: 20px;
    }

    .player-title-bar h2 {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--cyber-primary);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .player-title-bar h2.placeholder {
      color: #64748b;
      font-weight: 400;
      text-transform: none;
    }

    .video-wrap {
      position: relative;
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--cyber-border);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.8), inset 0 0 10px rgba(0, 243, 255, 0.1);
      background: #050b14;
      aspect-ratio: 16/9;
    }

    #video-player {
      width: 100%;
      height: 100%;
      display: block;
      background: #050b14;
      object-fit: contain;
    }

    .video-hud-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      border: 1px solid rgba(0, 243, 255, 0.15);
      background: linear-gradient(180deg, rgba(0,243,255,0.02) 0%, transparent 80%, rgba(255,0,85,0.03) 100%);
    }

    .hud-corner {
      position: absolute;
      width: 10px;
      height: 10px;
      border: 2px solid var(--cyber-primary);
    }

    .hud-corner.tl { top: 4px; left: 4px; border-right: 0; border-bottom: 0; }
    .hud-corner.tr { top: 4px; right: 4px; border-left: 0; border-bottom: 0; }
    .hud-corner.bl { bottom: 4px; left: 4px; border-right: 0; border-top: 0; }
    .hud-corner.br { bottom: 4px; right: 4px; border-left: 0; border-top: 0; }

    .video-watermark {
      position: absolute;
      top: 8px;
      right: 10px;
      padding: 3px 8px;
      border-radius: 15px;
      background: rgba(3, 7, 18, 0.85);
      border: 1px solid var(--cyber-primary);
      font-size: 0.55rem;
      font-weight: 800;
      color: var(--cyber-primary);
      letter-spacing: 1.2px;
      pointer-events: none;
      z-index: 5;
      box-shadow: 0 0 8px rgba(0, 243, 255, 0.3);
    }

    .player-status {
      margin-top: 4px;
      font-size: 0.7rem;
      color: #94a3b8;
      font-family: monospace;
      min-height: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .player-status::before {
      content: '';
      display: inline-block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--cyber-primary);
      box-shadow: 0 0 5px var(--cyber-primary);
    }

    /* SECTION CONTROLS & SEARCH */
    .controls-wrapper {
      padding: 6px 16px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .section-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tab-btn {
      flex: 1;
      min-width: 80px;
      padding: 8px 4px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--cyber-border);
      border-radius: 8px;
      color: #94a3b8;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      text-align: center;
    }

    .tab-btn.active {
      background: rgba(0, 243, 255, 0.15);
      color: var(--cyber-primary);
      border-color: var(--cyber-primary);
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.25);
    }

    .tab-btn.zong-tab.active {
      background: rgba(255, 0, 85, 0.15);
      color: var(--cyber-secondary);
      border-color: var(--cyber-secondary);
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.25);
    }

    .tab-btn.tamasha-tab {
      background: rgba(255, 153, 0, 0.1);
      color: #ff9900;
      border-color: rgba(255, 153, 0, 0.3);
    }

    .tab-btn.tamasha-tab:hover,
    .tab-btn.tamasha-tab:active {
      background: rgba(255, 153, 0, 0.25);
      border-color: #ff9900;
      box-shadow: 0 0 10px rgba(255, 153, 0, 0.3);
    }

    .tab-btn.game-tab {
      background: rgba(0, 255, 128, 0.1);
      color: #00ff80;
      border-color: rgba(0, 255, 128, 0.3);
    }

    .tab-btn.game-tab:hover,
    .tab-btn.game-tab:active {
      background: rgba(0, 255, 128, 0.25);
      border-color: #00ff80;
      box-shadow: 0 0 10px rgba(0, 255, 128, 0.3);
    }

    .search-box input {
      width: 100%;
      padding: 8px 14px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--cyber-border);
      border-radius: 8px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .search-box input:focus {
      border-color: var(--cyber-primary);
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.25);
    }

    .search-box input::placeholder {
      color: #475569;
    }

    /* SCROLLABLE CHANNELS CONTAINER */
    .channels-container {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px 30px;
      -webkit-overflow-scrolling: touch;
    }

    .section-title {
      padding: 8px 6px 10px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-title::after {
      content: 'CYBORG_SYSTEM_V2.0';
      font-size: 0.6rem;
      color: var(--cyber-primary);
      opacity: 0.7;
    }

    .channels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
      gap: 10px;
    }

    .channel-card {
      background: var(--cyber-card);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(0, 243, 255, 0.15);
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
      text-align: center;
      backdrop-filter: blur(8px);
    }

    .channel-card:hover,
    .channel-card:active {
      transform: translateY(-2px);
      border-color: var(--cyber-primary);
      box-shadow: 0 4px 15px rgba(0, 243, 255, 0.25);
    }

    .channel-card.playing {
      border-color: var(--cyber-secondary);
      box-shadow: 0 0 12px rgba(255, 0, 85, 0.4);
      background: rgba(255, 0, 85, 0.1);
    }

    .channel-logo {
      width: 48px;
      height: 48px;
      margin: 8px auto 0;
      border-radius: 50%;
      background: #0b1120;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--cyber-primary);
      overflow: hidden;
      border: 1px solid var(--cyber-border);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
    }

    .channel-logo img {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      border-radius: 50%;
    }

    .channel-info {
      padding: 6px 4px 8px;
      text-align: center;
    }

    .channel-name {
      font-size: 0.7rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #f1f5f9;
      letter-spacing: 0.3px;
    }

    .channel-cat {
      font-size: 0.55rem;
      margin-top: 2px;
      color: var(--cyber-primary);
      font-weight: 600;
      text-transform: uppercase;
      opacity: 0.8;
      letter-spacing: 0.5px;
    }

    .channel-card.playing .channel-name {
      color: #fff;
      text-shadow: 0 0 5px var(--cyber-secondary);
    }

    .channel-card.playing .channel-cat {
      color: var(--cyber-secondary);
    }

    .note {
      text-align: center;
      padding: 15px 16px;
      font-size: 0.7rem;
      color: #475569;
      letter-spacing: 1px;
      font-family: monospace;
    }
  </style>
</head>

  <!-- MAIN APP -->

    <!-- LOCKED TOP: Header + Player + Controls -->
    <div class="sticky-top">

      <div class="player-area" id="player-area">

            <div class="hud-corner bl"></div>
            <div class="hud-corner br"></div>
          </div>
          <div class="video-watermark">UMA TV HUD</div>
        </div>
        <div class="player-status" id="player-status">System Ready</div>
      </div>

      <div class="controls-wrapper">
        <div class="section-tabs">
          <button class="tab-btn active" id="tab-jazz" onclick="switchSection('jazz')">Jazz TV</button>
          <button class="tab-btn tamasha-tab" onclick="window.open('https://tamashaweb.com/', '_blank')">Tamasha Web</button>
          <button class="tab-btn zong-tab" id="tab-zong" onclick="switchSection('zong')">Zong TV</button>
          <button class="tab-btn game-tab" onclick="window.open('https://social.gamenow.com.pk/', '_blank')">Game Hub</button>
        </div>
        <div class="search-box">
          <input type="text" id="search" placeholder="Search channels..." oninput="filterChannels()">
        </div>
      </div>
    </div>

    <!-- Scrollable Channels Grid Container -->

      <div class="channels-grid" id="channels-grid"></div>

    let currentProvider = 'jazz';

    let currentPlaying = null;

    function getCurrentList() {
      return currentProvider === 'jazz' ? jazzChannels : zongChannels;
    }

    function switchSection(provider) {
      currentProvider = provider;
      document.getElementById('tab-jazz').classList.toggle('active', provider === 'jazz');
      document.getElementById('tab-zong').classList.toggle('active', provider === 'zong');
      
      const titleEl = document.getElementById('grid-title');
      const badgeEl = document.getElementById('provider-badge');
      
      if (provider === 'jazz') {
        titleEl.textContent = 'JAZZ TV CHANNELS';
        badgeEl.textContent = 'JAZZ LIVE (TAMASHA)';
      } else {
        titleEl.textContent = 'ZONG TV CHANNELS';
        badgeEl.textContent = 'ZONG LIVE (MJUNOON)';
      }

      document.getElementById("search").value = "";
      renderChannels(getCurrentList());
    }

    // Digital Clock Function
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      let minutes = now.getMinutes();
      let seconds = now.getSeconds();
      const ampm = hours >= 12 ? 'PM' : 'AM';
      
      hours = hours % 12;
      hours = hours ? hours : 12;
      minutes = minutes < 10 ? '0' + minutes : minutes;
      seconds = seconds < 10 ? '0' + seconds : seconds;
      
      const timeString = `${hours}:${minutes}:${seconds} ${ampm}`;
      const clockEl = document.getElementById("digital-clock");
      if (clockEl) clockEl.textContent = timeString;
    }

    function renderChannels(list) {
      const grid = document.getElementById("channels-grid");
      if (!grid) return;
      grid.innerHTML = "";
      if (list.length === 0) {
        grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#64748b;padding:40px 0;font-family:monospace;">NO SIGNAL / CHANNEL NOT FOUND</p>';
        return;
      }
      list.forEach(ch => {
        const card = document.createElement("div");
        card.className = "channel-card" + (currentPlaying === ch.name ? " playing" : "");
        card.onclick = () => openPlayer(ch);
        const logoHtml = ch.logo
          ? `<img src="${ch.logo}" alt="${ch.name}">`
          : `<span style="color:${ch.color || 'var(--cyber-primary)'};">${ch.name.charAt(0)}</span>`;
        card.innerHTML = `
          <div class="channel-logo">${logoHtml}</div>
          <div class="channel-info">
            <div class="channel-name">${ch.name}</div>
            <div class="channel-cat">${ch.cat}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterChannels() {
      const q = document.getElementById("search").value.toLowerCase().trim();
      let filtered = getCurrentList();
      if (q) filtered = filtered.filter(c => c.name.toLowerCase().includes(q) || c.cat.toLowerCase().includes(q));
      renderChannels(filtered);
    }

    function openPlayer(ch) {
      currentPlaying = ch.name;
      const titleEl = document.getElementById("player-title");
      titleEl.textContent = ch.name;
      titleEl.classList.remove("placeholder");
      document.getElementById("player-status").textContent = "Establishing Connection to Stream...";

      const video = document.getElementById("video-player");
      if (hls) { hls.destroy(); hls = null; }
      video.pause();
      video.removeAttribute("src");

      if (Hls.isSupported()) {
        hls = new Hls({ enableWorker: true, lowLatencyMode: false });
        hls.loadSource(ch.link);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          document.getElementById("player-status").textContent = "STREAM LIVE • " + ch.name;
          video.play().catch(() => {});
        });
        hls.on(Hls.Events.ERROR, (e, data) => {
          if (data.fatal) {
            document.getElementById("player-status").textContent = "SIGNAL LOST / SERVER OFFLINE";
          }
        });
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = ch.link;
        video.addEventListener("loadedmetadata", () => {
          document.getElementById("player-status").textContent = "STREAM LIVE • " + ch.name;
          video.play().catch(() => {});
        }, { once: true });
      } else {
        document.getElementById("player-status").textContent = "HLS NOT SUPPORTED BY BROWSER";
      }

      filterChannels();
    }

    function initApp() {
      updateClock();
      setInterval(updateClock, 1000);
      renderChannels(jazzChannels);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
