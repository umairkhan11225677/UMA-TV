
<div id="uma-tv-app">
<style type="text/css">
#uma-tv-app{--p:#00f3ff;--s:#ff0055;--bg:#030712;--card:rgba(15,23,42,.92);font-family:Arial,sans-serif;color:#e2e8f0;background:var(--bg);background-image:radial-gradient(circle at center top,rgba(0,243,255,.1),transparent),linear-gradient(rgba(0,243,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,243,255,.025) 1px,transparent 1px);background-size:auto,30px 30px,30px 30px;border:1px solid rgba(0,243,255,.25);border-radius:12px;overflow:hidden;margin:10px auto}
#uma-tv-app *{box-sizing:border-box}
#uma-tv-app .app-inner{height:82vh;min-height:600px;display:flex;flex-direction:column}
#uma-tv-app .sticky-top{flex-shrink:0;background:rgba(3,7,18,.98);border-bottom:1px solid rgba(0,243,255,.2)}
#uma-tv-app header{padding:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
#uma-tv-app .head-left{display:flex;align-items:center;gap:9px;min-width:0}
#uma-tv-app .logo{width:40px;height:40px;border:1px solid var(--p);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:bold;background:#090d16;color:white;flex-shrink:0}
#uma-tv-app .logo span{font-size:10px;color:var(--s)}
#uma-tv-app h1{font-size:16px;margin:0;color:white}
#uma-tv-app h1 span{color:var(--s)}
#uma-tv-app .sub{font-size:10px;color:var(--p);margin-top:4px}
#uma-tv-app .clock{font-family:monospace;font-size:12px;color:var(--p);padding:7px;border:1px solid rgba(0,243,255,.25);border-radius:6px;white-space:nowrap}
#uma-tv-app .player-area{padding:8px 12px}
#uma-tv-app .player-title{font-size:13px;color:var(--p);margin:0 0 7px;text-transform:uppercase;min-height:16px}
#uma-tv-app .video-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#050b14;border:1px solid rgba(0,243,255,.3);border-radius:9px;overflow:hidden}
#uma-tv-app video{display:block;width:100%;height:100%;object-fit:contain;background:#050b14}
#uma-tv-app .watermark{position:absolute;top:8px;right:8px;color:var(--p);font-size:9px;border:1px solid var(--p);border-radius:12px;padding:4px 7px;background:rgba(3,7,18,.8);pointer-events:none}
#uma-tv-app .status{font:11px monospace;color:#94a3b8;padding-top:7px;min-height:24px}
#uma-tv-app .controls{padding:5px 12px 12px;display:flex;flex-direction:column;gap:9px}
#uma-tv-app .tabs{display:flex;gap:6px;flex-wrap:wrap}
#uma-tv-app .tab{flex:1;min-width:75px;padding:9px 5px;border-radius:7px;background:#0f172a;border:1px solid rgba(0,243,255,.25);color:#94a3b8;font-size:11px;font-weight:bold;cursor:pointer}
#uma-tv-app .tab.active{background:rgba(0,243,255,.13);color:var(--p);border-color:var(--p)}
#uma-tv-app .tab.zong{color:#ff6688;border-color:rgba(255,0,85,.35)}
#uma-tv-app .tab.zong.active{background:rgba(255,0,85,.15);border-color:var(--s);color:#ff6688}
#uma-tv-app .tab.external{color:#ffb347;border-color:rgba(255,153,0,.3)}
#uma-tv-app .search{width:100%;padding:10px 12px;border-radius:8px;border:1px solid rgba(0,243,255,.25);background:#0f172a;color:white;font-size:14px;outline:none}
#uma-tv-app .channels-container{flex:1;min-height:0;overflow-y:auto;padding:10px 12px 25px;-webkit-overflow-scrolling:touch}
#uma-tv-app .section-title{font-size:12px;color:#94a3b8;letter-spacing:1px;font-weight:bold;padding:6px 2px 12px;display:flex;justify-content:space-between;gap:6px}
#uma-tv-app .system-label{font-size:9px;color:var(--p);opacity:.7}
#uma-tv-app .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:9px}
#uma-tv-app .channel-card{background:var(--card);border:1px solid rgba(0,243,255,.15);border-radius:9px;text-align:center;overflow:hidden;cursor:pointer;min-width:0}
#uma-tv-app .channel-card:active{border-color:var(--p)}
#uma-tv-app .channel-card.playing{border-color:var(--s);background:rgba(255,0,85,.12)}
#uma-tv-app .ch-logo{width:47px;height:47px;margin:9px auto 0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#0b1120;border:1px solid rgba(0,243,255,.25);font-size:20px;font-weight:bold;overflow:hidden}
#uma-tv-app .ch-logo img{width:100%;height:100%;object-fit:cover}
#uma-tv-app .ch-info{padding:7px 4px 9px}
#uma-tv-app .ch-name{font-size:11px;font-weight:bold;color:#f1f5f9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#uma-tv-app .ch-cat{font-size:9px;color:var(--p);margin-top:4px;text-transform:uppercase}
#uma-tv-app .playing .ch-name,#uma-tv-app .playing .ch-cat{color:#ff6688}
#uma-tv-app .note{text-align:center;padding:18px 5px;font:10px monospace;color:#475569}
@media(max-width:400px){#uma-tv-app .app-inner{height:85vh;min-height:550px}#uma-tv-app .grid{grid-template-columns:repeat(3,minmax(0,1fr))}#uma-tv-app .tab{font-size:10px}}
</style>

function getCurrentList(){

}

window.umaSwitchSection = function(provider){
  currentProvider = provider;
  document.getElementById("uma-tab-jazz").classList.toggle("active",provider === "jazz");
  document.getElementById("uma-tab-zong").classList.toggle("active",provider === "zong");
  document.getElementById("uma-grid-title").textContent = provider === "jazz" ? "JAZZ TV CHANNELS" : "ZONG TV CHANNELS";
  document.getElementById("uma-provider-badge").textContent = provider === "jazz" ? "JAZZ LIVE (TAMASHA)" : "ZONG LIVE (MJUNOON)";
  document.getElementById("uma-search").value = "";
  renderChannels(getCurrentList());
};

function updateClock(){
  var now = new Date();
  var h = now.getHours();
  var ampm = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  var m = String(now.getMinutes()).padStart(2,"0");
  var s = String(now.getSeconds()).padStart(2,"0");
  document.getElementById("uma-digital-clock").textContent = h + ":" + m + ":" + s + " " + ampm;
}

    empty.style.cssText = "grid-column:1/-1;text-align:center;color:#64748b;padding:40px 5px;font:12px monospace";
    empty.textContent = "NO CHANNEL FOUND";
    grid.appendChild(empty);
    return;
  }

  list.forEach(function(ch){
    var card = document.createElement("div");
    card.className = "channel-card" + (currentPlaying === ch[0] ? " playing" : "");
    card.setAttribute("role","button");
    card.setAttribute("tabindex","0");
    card.setAttribute("aria-label","Play " + ch[0]);
    card.addEventListener("click",function(){openPlayer(ch);});
    card.addEventListener("keydown",function(e){
      if(e.key === "Enter" || e.key === " "){
        e.preventDefault();
        openPlayer(ch);
      }
    });

    var logo = document.createElement("div");
    logo.className = "ch-logo";
    logo.style.color = ch[3] || "var(--p)";
    logo.textContent = ch[0].charAt(0);

    var info = document.createElement("div");
    info.className = "ch-info";
    var name = document.createElement("div");
    name.className = "ch-name";
    name.textContent = ch[0];
    var cat = document.createElement("div");
    cat.className = "ch-cat";
    cat.textContent = ch[1];

    info.appendChild(name);
    info.appendChild(cat);
    card.appendChild(logo);
    card.appendChild(info);
    grid.appendChild(card);
  });
}

window.umaFilterChannels = function(){
  var q = document.getElementById("uma-search").value.toLowerCase().trim();
  var list = getCurrentList().filter(function(ch){
    return ch[0].toLowerCase().indexOf(q) !== -1 || ch[1].toLowerCase().indexOf(q) !== -1;
  });
  renderChannels(list);
};

function openPlayer(ch){
  currentPlaying = ch[0];
  titleEl.textContent = ch[0];
  statusEl.textContent = "Connecting to stream...";
  if(hls){
    hls.destroy();
    hls = null;
  }
  video.pause();
  video.removeAttribute("src");
  video.load();

  if(window.Hls && window.Hls.isSupported()){
    hls = new window.Hls({enableWorker:true,lowLatencyMode:false});
    hls.loadSource(ch[2]);
    hls.attachMedia(video);

    hls.on(window.Hls.Events.MANIFEST_PARSED,function(){
      statusEl.textContent = "STREAM READY - " + ch[0];
      video.play().catch(function(){
        statusEl.textContent = "Stream ready. Press Play to start - " + ch[0];
      });
    });

    hls.on(window.Hls.Events.ERROR,function(event,data){
      if(data && data.fatal){
        statusEl.textContent = "Stream unavailable. Check channel URL or server.";
        hls.destroy();
        hls = null;
      }
    });
  }else if(video.canPlayType("application/vnd.apple.mpegurl")){
    video.src = ch[2];
    video.addEventListener("loadedmetadata",function(){
      statusEl.textContent = "STREAM READY - " + ch[0];
      video.play().catch(function(){
        statusEl.textContent = "Stream ready. Press Play to start - " + ch[0];
      });
    },{once:true});
    video.addEventListener("error",function(){
      statusEl.textContent = "Stream unavailable or URL expired.";
    },{once:true});
  }else{
    statusEl.textContent = "HLS playback is not supported by this browser.";
  }
  renderChannels(getCurrentList());
}

updateClock();
window.setInterval(updateClock,1000);
renderChannels(jazzChannels);
})();
